[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphite"
version = "0.1.0"
description = "Photo -> graphite drawing pipeline (perception + physical stroke simulation, no generative pixel synthesis)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "shapely>=2.0",
    "numba>=0.59",
    "PyYAML>=6.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]
perception = ["torch>=2.2", "onnxruntime>=1.17"]
tune = ["optuna>=3.6"]

[project.scripts]
graphite = "graphite.cli:main"

[tool.setuptools.packages.find]
include = ["graphite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
